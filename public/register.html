<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">◆</div>
    
    <div class="login-header">
      <h1>Create account</h1>
      <p>Get started with your free account today</p>
    </div>

    <form action="/register" method="POST">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" class="form-input" placeholder="John Doe" required autofocus>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required>
      </div>

      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="login-footer">
      Already have an account? <a href="/">Sign in</a>
    </div>
  </div>
</body>
</html>
