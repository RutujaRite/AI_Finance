<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <style>
    :root {
      --chat-bg: #0f172a;
      --chat-surface: #1e293b;
      --chat-surface-2: #334155;
      --chat-border: #334155;
      --chat-text: #f1f5f9;
      --chat-text-secondary: #cbd5e1;
      --chat-text-muted: #94a3b8;
      --chat-user-bubble: #3b82f6;
      --chat-ai-bubble: #1e293b;
      --chat-accent: #6366f1;
      --chat-accent-2: #8b5cf6;
    }

    .chat-layout {
      display: flex;
      height: calc(100vh - 64px);
      background: var(--chat-bg);
      color: var(--chat-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .chat-sidebar {
      width: 280px;
      background: var(--chat-surface);
      border-right: 1px solid var(--chat-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
    }

    .chat-sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--chat-border);
    }

    .chat-new-chat-btn {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--chat-border);
      border-radius: 10px;
      background: var(--chat-surface-2);
      color: var(--chat-text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .chat-new-chat-btn:hover {
      background: #475569;
      border-color: #64748b;
    }

    .chat-search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--chat-border);
    }

    .chat-search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--chat-border);
      border-radius: 10px;
      background: var(--chat-bg);
      color: var(--chat-text);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .chat-search-input:focus {
      border-color: var(--chat-accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .chat-search-input::placeholder {
      color: var(--chat-text-muted);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .chat-list::-webkit-scrollbar {
      width: 6px;
    }

    .chat-list::-webkit-scrollbar-thumb {
      background: var(--chat-border);
      border-radius: 3px;
    }

    .chat-conversation-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--chat-text);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      margin-bottom: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .chat-conversation-item:hover {
      background: var(--chat-surface-2);
    }

    .chat-conversation-item.active {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .chat-conversation-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--chat-text);
    }

    .chat-conversation-meta {
      font-size: 11px;
      color: var(--chat-text-muted);
      margin-top: 2px;
    }

    .chat-sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--chat-border);
      font-size: 12px;
      color: var(--chat-text-muted);
      text-align: center;
    }

    .chat-sidebar-footer button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font: inherit;
      opacity: 0.8;
      transition: opacity 0.15s ease;
    }

    .chat-sidebar-footer button:hover {
      opacity: 1;
    }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--chat-border);
      border-radius: 4px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-message {
      display: flex;
      gap: 16px;
      max-width: 820px;
      width: 100%;
      animation: messageIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .chat-message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .chat-message.ai {
      align-self: flex-start;
    }

    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    .chat-message.user .chat-avatar {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .chat-message.ai .chat-avatar {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .chat-bubble {
      padding: 16px 20px;
      border-radius: 18px;
      max-width: 75%;
      line-height: 1.7;
      font-size: 15px;
      position: relative;
      word-wrap: break-word;
    }

    .chat-message.user .chat-bubble {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
    }

    .chat-message.ai .chat-bubble {
      background: var(--chat-surface);
      color: var(--chat-text);
      border: 1px solid var(--chat-border);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .chat-bubble p {
      margin: 0 0 12px;
    }

    .chat-bubble p:last-child {
      margin-bottom: 0;
    }

    .chat-bubble ul,
    .chat-bubble ol {
      margin: 10px 0;
      padding-left: 22px;
    }

    .chat-bubble li {
      margin-bottom: 6px;
    }

    .chat-bubble strong {
      color: #f1f5f9;
      font-weight: 600;
    }

    .chat-bubble a {
      color: #60a5fa;
      text-decoration: none;
    }

    .chat-bubble a:hover {
      text-decoration: underline;
    }

    .chat-code-block {
      position: relative;
      margin: 14px 0;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid var(--chat-border);
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .chat-code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--chat-border);
      color: var(--chat-text-muted);
      font-size: 12px;
    }

    .chat-code-lang {
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      font-size: 11px;
    }

    .chat-code-copy {
      padding: 4px 12px;
      border: 1px solid var(--chat-border);
      border-radius: 6px;
      background: var(--chat-surface);
      color: var(--chat-text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .chat-code-copy:hover {
      background: var(--chat-surface-2);
      color: var(--chat-text);
    }

    .chat-code-copy.copied {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #10b981;
    }

    .chat-welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      color: var(--chat-text-secondary);
    }

    .chat-welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--chat-accent), var(--chat-accent-2));
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 40px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(99, 102, 241, 0.35);
    }

    .chat-welcome h2 {
      font-size: 28px;
      font-weight: 800;
      color: var(--chat-text);
      margin-bottom: 12px;
    }

    .chat-welcome p {
      font-size: 16px;
      color: var(--chat-text-muted);
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 600px;
    }

    .chat-suggestion {
      padding: 10px 18px;
      background: var(--chat-surface);
      border: 1px solid var(--chat-border);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      color: var(--chat-text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .chat-suggestion:hover {
      background: var(--chat-surface-2);
      border-color: var(--chat-accent);
      color: var(--chat-text);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    .chat-company-card {
      margin-top: 18px;
      padding: 20px;
      border-radius: 14px;
      background: var(--chat-surface);
      border: 1px solid var(--chat-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .chat-company-title {
      font-weight: 700;
      color: var(--chat-text);
      margin-bottom: 14px;
      font-size: 15px;
    }

    .chat-company-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .chat-company-label {
      font-size: 11px;
      color: var(--chat-text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .chat-company-value {
      font-size: 13px;
      color: var(--chat-text);
      font-weight: 600;
      margin-top: 4px;
    }

    .chat-composer {
      padding: 20px 24px 24px;
      background: var(--chat-bg);
      border-top: 1px solid var(--chat-border);
    }

    .chat-composer-form {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: var(--chat-surface);
      border: 1px solid var(--chat-border);
      border-radius: 16px;
      padding: 8px 8px 8px 20px;
      transition: all 0.2s ease;
    }

    .chat-composer-form:focus-within {
      border-color: var(--chat-accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .chat-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .chat-input {
      width: 100%;
      padding: 12px 0;
      border: none;
      border-radius: 12px;
      background: transparent;
      font: inherit;
      font-size: 15px;
      color: var(--chat-text);
      outline: none;
      resize: none;
      max-height: 200px;
      min-height: 24px;
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: var(--chat-text-muted);
    }

    .chat-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      color: white;
      background: linear-gradient(135deg, var(--chat-accent), var(--chat-accent-2));
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    .chat-send-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat-disclaimer {
      text-align: center;
      font-size: 11px;
      color: var(--chat-text-muted);
      margin-top: 10px;
      font-weight: 500;
    }

    .chat-typing-indicator {
      display: inline-flex;
      gap: 6px;
      padding: 4px 2px;
      align-items: center;
    }

    .chat-typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--chat-text-muted);
      animation: typingBounce 1.2s infinite;
    }

    .chat-typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .chat-typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    .typing-bubble {
      display: inline-flex;
      padding: 14px 18px;
      border-radius: 18px;
      background: var(--chat-surface);
      border: 1px solid var(--chat-border);
      gap: 4px;
      align-items: center;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--chat-text-muted);
    }

    .message-copy-btn {
      background: none;
      border: none;
      color: var(--chat-text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .message-copy-btn:hover {
      background: var(--chat-surface-2);
      color: var(--chat-text);
    }

    .result-card {
      margin-top: 14px;
      background: var(--chat-surface);
      border: 1px solid var(--chat-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .result-card-header {
      padding: 14px 18px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
      border-bottom: 1px solid var(--chat-border);
      font-weight: 700;
      font-size: 14px;
      color: var(--chat-text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-card-body {
      padding: 6px;
    }

    .result-item {
      padding: 12px 14px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }

    .result-item:hover {
      background: var(--chat-surface-2);
    }

    .result-item + .result-item {
      border-top: 1px solid var(--chat-border);
    }

    .result-item-title {
      font-weight: 700;
      color: var(--chat-text);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .result-item-meta {
      font-size: 12px;
      color: var(--chat-text-muted);
      line-height: 1.5;
    }

    .result-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-size: 11px;
      font-weight: 700;
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    .no-results {
      margin-top: 14px;
      padding: 16px 18px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      color: #fca5a5;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .chat-sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 20;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.4);
      }

      .chat-sidebar.open {
        transform: translateX(0);
      }

      .chat-bubble {
        max-width: 88%;
      }
    }
  </style>
</head>
<body class="home-body">
  <header class="topbar app-topbar">
    <a class="brand" href="/home">
      <span class="brand-mark">◆</span>
      <span class="brand-text">AI ASSISTANT</span>
    </a>
    <nav class="nav-menu" aria-label="Main navigation">
      <a href="/home" class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="/emi" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><path d="M12 12h.01"/></svg>
        EMI Calculator
      </a>
      <a href="/admin" class="nav-item">
      <a href="/bank-managers" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a2 2 0 0 0-2 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Bank Manager
      </a>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Admin
      </a>
      <div class="nav-item profile-menu" role="link" tabindex="0" onclick="window.location='/profile'">
        <span class="profile-menu-label">{{ userName }}</span>
        <span class="caret">▾</span>
        <div class="profile-dropdown">
          <a href="/profile">Profile</a>
          <a href="/logout">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="chat-layout">
    <aside class="chat-sidebar" id="chatSidebar">
      <div class="chat-sidebar-header">
        <button class="chat-new-chat-btn" id="chatNewConversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          New Chat
        </button>
      </div>
      <div class="chat-search-box">
        <input type="text" class="chat-search-input" id="chatSearchInput" placeholder="Search conversations..." />
      </div>
      <div class="chat-list" id="chatConversationList"></div>
      <div class="chat-sidebar-footer">
        <button id="clearHistoryBtn">Clear History</button>
      </div>
    </aside>

    <main class="chat-main">
      <div class="chat-messages" id="chatMessages">
        <div id="chatMessagesInner">
          <div class="chat-welcome" id="chatWelcomeMessage">
            <div class="chat-welcome-icon">💬</div>
            <h2>Hello! How can I help you today?</h2>
            <p>Ask me anything about loans, EMI calculations, bank managers, or your account.</p>
            <div class="chat-suggestions">
              <button class="chat-suggestion" onclick="useSuggestion('Calculate EMI for a home loan of 500000 at 9.5% for 60 months')">Calculate EMI</button>
              <button class="chat-suggestion" onclick="useSuggestion('Tell me about loan processing fees')">Processing Fees</button>
              <button class="chat-suggestion" onclick="useSuggestion('How can I update my profile?')">Profile Help</button>
              <button class="chat-suggestion" onclick="useSuggestion('Give me ICICI manager details in Pune')">Bank Managers</button>
            </div>
          </div>
          <div id="aiTypingIndicator" class="chat-message ai" style="display:none;">
            <div class="chat-avatar">AI</div>
            <div class="chat-bubble typing-bubble">
              <div class="chat-typing-indicator">
                <div class="chat-typing-dot"></div>
                <div class="chat-typing-dot"></div>
                <div class="chat-typing-dot"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-composer">
        <form class="chat-composer-form" id="chatForm" autocomplete="off">
          <div class="chat-input-wrap">
            <textarea class="chat-input" id="chatInput" placeholder="Message AI ASSISTANT..." rows="1"></textarea>
          </div>
          <button class="chat-send-btn" id="chatSend" type="submit" title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="chat-disclaimer">AI can make mistakes. Please verify important information.</div>
      </div>
    </main>
  </div>

  <script>
    (function() {
      const STORAGE_KEY = 'emi_chat_state_v2';
      const messagesInner = document.getElementById('chatMessagesInner');
      const welcomeMessage = document.getElementById('chatWelcomeMessage');
      const conversationListEl = document.getElementById('chatConversationList');
      const searchInput = document.getElementById('chatSearchInput');
      const form = document.getElementById('chatForm');
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('chatSend');
      const aiTypingIndicator = document.getElementById('aiTypingIndicator');

      const API_BASE = '/api';

      function getToken() { return ''; }

      function clearAuthAndRedirect() { window.location.assign('/'); }

      function request(path, options) {
        const url = API_BASE + path;
        const defaults = { headers: { 'Content-Type': 'application/json' } };
        const merged = Object.assign({}, defaults, options || {});
        if (merged.body && typeof merged.body === 'object' && !(merged.body instanceof FormData)) {
          merged.body = JSON.stringify(merged.body);
        }
        return fetch(url, merged).then(async (response) => {
          const contentType = response.headers.get('content-type') || '';
          const isJson = contentType.includes('application/json');
          const data = isJson ? await response.json() : null;
          if (!response.ok) {
            const message = (data && (data.error || data.detail || data.message)) || 'Request failed';
            const error = new Error(message);
            error.status = response.status;
            error.body = data;
            throw error;
          }
          return data;
        });
      }

      const api = {
        chat: {
          send: (message, conversationId) => request('/chat', { method: 'POST', body: { message, conversation_id: conversationId } }),
          listConversations: () => request('/conversations'),
          getConversation: (conversationId) => request('/conversations/' + encodeURIComponent(conversationId)),
          deleteConversation: (conversationId) => request('/conversations/' + encodeURIComponent(conversationId), { method: 'DELETE' }),
          pinConversation: (conversationId, pinned) => request('/conversations/' + encodeURIComponent(conversationId) + '/pin', { method: 'POST', body: { pinned } }),
        },
        company: {
          search: (companyName) => request('/company/search', { method: 'POST', body: { company_name: companyName } }),
          getData: (companyName) => request('/company/' + encodeURIComponent(companyName)),
          listMatches: (query) => request('/company/list?q=' + encodeURIComponent(query)),
        },
        bank: {
          listFiles: () => request('/bank/files'),
          uploadFile: (formData) => request('/bank/upload', { method: 'POST', body: formData, headers: {} }),
          deleteFile: (fileId) => request('/bank/files/' + encodeURIComponent(String(fileId)), { method: 'DELETE' }),
        },
      };

      const state = {
        messages: [],
        conversations: [],
        activeConversationId: null,
        isLoading: false,
        isSidebarOpen: false,
        error: undefined,
        searchQuery: '',
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          state.messages = Array.isArray(parsed.messages) ? parsed.messages : [];
          state.conversations = Array.isArray(parsed.conversations) ? parsed.conversations : [];
          state.activeConversationId = parsed.activeConversationId || null;
        } catch (e) {
          console.error('Failed to load chat state', e);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            messages: state.messages,
            conversations: state.conversations,
            activeConversationId: state.activeConversationId,
          }));
        } catch (e) {
          console.error('Failed to save chat state', e);
        }
      }

      function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
      function now() { return new Date().toISOString(); }

      function activeConversation() {
        if (!state.activeConversationId) return null;
        return state.conversations.find(c => c.id === state.activeConversationId) || null;
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, function(char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char] || char;
        });
      }

      function formatTime(value) {
        if (!value) return '';
        const date = new Date(String(value));
        if (isNaN(date.getTime())) return '';
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function formatDate(value) {
        if (!value) return '';
        const date = new Date(String(value));
        if (isNaN(date.getTime())) return '';
        const now = new Date();
        const diff = now - date;
        if (diff < 86400000) return 'Today';
        if (diff < 172800000) return 'Yesterday';
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }

      function renderMarkdown(source) {
        if (typeof marked !== 'undefined' && marked.parse) {
          try {
            const html = marked.parse(source || '', { gfm: true, breaks: false });
            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            enhanceCodeBlocks(wrapper);
            return wrapper.innerHTML;
          } catch (e) {
            console.error('Markdown parse error', e);
          }
        }
        return escapeHtml(source || '').replace(/\\n/g, '<br>');
      }

      function enhanceCodeBlocks(container) {
        const blocks = container.querySelectorAll('pre code');
        blocks.forEach((codeEl) => {
          const pre = codeEl.parentElement;
          if (!pre || pre.tagName !== 'PRE') return;

          const wrapper = document.createElement('div');
          wrapper.className = 'chat-code-block';

          const header = document.createElement('div');
          header.className = 'chat-code-header';

          const langLabel = document.createElement('span');
          langLabel.className = 'chat-code-lang';
          const langClass = Array.from(codeEl.classList).find((c) => c.startsWith('language-'));
          langLabel.textContent = langClass ? langClass.replace('language-', '') : 'CODE';

          const copyBtn = document.createElement('button');
          copyBtn.className = 'chat-code-copy';
          copyBtn.textContent = 'Copy';
          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(codeEl.textContent || '');
              copyBtn.textContent = 'Copied!';
              copyBtn.classList.add('copied');
              setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
            } catch (e) {
              copyBtn.textContent = 'Failed';
              setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
            }
          });

          header.appendChild(langLabel);
          header.appendChild(copyBtn);

          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(header);
          wrapper.appendChild(pre);

          if (typeof hljs !== 'undefined') {
            try { hljs.highlightElement(codeEl); } catch (e) { /* ignore */ }
          }
        });
      }

      function renderBankManagerCard(data) {
        if (!data || !Array.isArray(data.managers) || data.managers.length === 0) {
          return '<div class="no-results">No matching bank managers found.</div>';
        }

        const managers = data.managers;
        let html = '<div class="result-card">';
        html += '<div class="result-card-header">🏦 ' + escapeHtml(data.count + ' Manager' + (data.count === 1 ? '' : 's') + ' Found') + '</div>';
        html += '<div class="result-card-body">';
        managers.forEach((m) => {
          html += '<div class="result-item">';
          html += '<div class="result-item-title">' + escapeHtml(m.manager_name || m.name || 'Unknown') + '</div>';
          html += '<div class="result-item-meta">';
          if (m.designation || m.role || m.branch_name) {
            html += escapeHtml(m.designation || m.role || m.branch_name || '') + '<br>';
          }
          if (m.mobile_no || m.phone) {
            html += '📱 ' + escapeHtml(m.mobile_no || m.phone || '-') + '<br>';
          }
          if (m.email_id || m.email) {
            html += '✉️ ' + escapeHtml(m.email_id || m.email || '-') + '<br>';
          }
          if (m.location_city || m.location) {
            html += '📍 ' + escapeHtml(m.location_city || m.location || '-');
          }
          html += '</div>';
          if (m.status && String(m.status).toLowerCase() === 'active') {
            html += '<span class="result-badge">Active</span>';
          }
          html += '</div>';
        });
        html += '</div></div>';
        return html;
      }

      function renderCompanyCard(data, query) {
        if (!data && !query) return '';
        let html = '<div class="result-card">';
        if (query) {
          html += '<div class="result-card-header">🏢 ' + escapeHtml(String(query)) + '</div>';
        }
        if (data && typeof data === 'object') {
          const bankRecords = Array.isArray(data.bank_records) ? data.bank_records : [];
          if (bankRecords.length) {
            html += '<div class="result-card-body">';
            bankRecords.forEach((r) => {
              html += '<div class="result-item">';
              html += '<div class="result-item-title">' + escapeHtml(r.bank_name || '-') + '</div>';
              html += '<div class="result-item-meta">';
              if (r.company_category) {
                html += escapeHtml(r.company_category) + '<br>';
              }
              if (r.other_info) {
                html += escapeHtml(r.other_info);
              }
              html += '</div></div>';
            });
            html += '</div>';
          }
        }
        html += '</div>';
        return html;
      }

      function renderMessage(message) {
        const isUser = message.role === 'user';
        const div = document.createElement('div');
        div.className = 'chat-message ' + message.role;
        div.setAttribute('data-message-id', message.id);

        const avatar = document.createElement('div');
        avatar.className = 'chat-avatar';
        avatar.textContent = isUser ? 'U' : 'AI';

        const content = document.createElement('div');
        content.className = 'chat-bubble';

        if (isUser) {
          content.textContent = message.content;
        } else {
          content.innerHTML = renderMarkdown(message.content);

          const companyData = message.company_data;
          const companyQuery = message.company_query;
          if (companyData || companyQuery) {
            const cardHtml = renderCompanyCard(companyData, companyQuery);
            if (cardHtml) {
              const cardWrap = document.createElement('div');
              cardWrap.innerHTML = cardHtml;
              content.appendChild(cardWrap);
            }
          }

          const bankData = message.bank_data;
          if (bankData) {
            const bankCardHtml = renderBankManagerCard(bankData);
            const bankCardWrap = document.createElement('div');
            bankCardWrap.innerHTML = bankCardHtml;
            content.appendChild(bankCardWrap);
          }
        }

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.innerHTML = '<span>' + escapeHtml(formatTime(message.timestamp)) + '</span>';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'message-copy-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(message.content || '');
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
          } catch (e) {
            copyBtn.textContent = 'Failed';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
          }
        });

        const wrapper = document.createElement('div');
        wrapper.appendChild(content);
        wrapper.appendChild(meta);
        if (!isUser) {
          wrapper.appendChild(copyBtn);
        }

        div.appendChild(avatar);
        div.appendChild(wrapper);
        return div;
      }

      function renderMessages() {
        messagesInner.innerHTML = '';
        if (aiTypingIndicator) aiTypingIndicator.style.display = 'none';
        if (state.messages.length === 0) {
          const welcome = document.getElementById('chatWelcomeMessage');
          if (welcome) messagesInner.appendChild(welcome);
          return;
        }
        state.messages.forEach((message) => {
          messagesInner.appendChild(renderMessage(message));
        });
        scrollToBottom();
      }

      function appendMessage(message) {
        const welcome = document.getElementById('chatWelcomeMessage');
        if (welcome) welcome.remove();
        messagesInner.appendChild(renderMessage(message));
        scrollToBottom();
      }

      function scrollToBottom() {
        const container = document.getElementById('chatMessages');
        if (container) container.scrollTop = container.scrollHeight;
      }

      function setLoading(loading) {
        state.isLoading = loading;
        sendBtn.disabled = loading;
        if (loading) {
          sendBtn.innerHTML = '<div class="chat-typing-indicator"><div class="chat-typing-dot"></div><div class="chat-typing-dot"></div><div class="chat-typing-dot"></div></div>';
          if (aiTypingIndicator) {
            aiTypingIndicator.style.display = 'flex';
            scrollToBottom();
          }
        } else {
          sendBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
          if (aiTypingIndicator) aiTypingIndicator.style.display = 'none';
        }
      }

      async function sendMessage(message) {
        if (!message.trim() || state.isLoading) return;
        const userMessage = { id: uid(), role: 'user', content: message.trim(), timestamp: now() };
        state.messages.push(userMessage);
        appendMessage(userMessage);
        saveState();
        input.value = '';
        input.style.height = 'auto';
        setLoading(true);

        try {
          const data = await api.chat.send(message, state.activeConversationId);
          if (data.success) {
            if (data.title && !state.activeConversationId) {
              const conversation = { id: data.conversation_id || uid(), title: data.title, pinned: false, createdAt: now() };
              state.conversations.unshift(conversation);
              state.activeConversationId = conversation.id;
            }
            const aiMessage = data.ai_message;
            if (aiMessage) {
              state.messages.push(aiMessage);
              appendMessage(aiMessage);
              saveState();
              renderConversationList();
            }
          } else {
            throw new Error(data.error || 'Failed to send message');
          }
        } catch (error) {
          console.error('Send message error:', error);
          const errorMessage = { id: uid(), role: 'ai', content: 'Error: ' + (error.message || 'Please try again.'), timestamp: now() };
          state.messages.push(errorMessage);
          appendMessage(errorMessage);
          saveState();
        } finally {
          setLoading(false);
        }
      }

      function renderConversationList() {
        conversationListEl.innerHTML = '';
        if (state.conversations.length === 0) {
          conversationListEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--chat-text-muted);font-size:13px;">No conversations yet</div>';
          return;
        }
        state.conversations.forEach((conversation) => {
          const item = document.createElement('button');
          item.className = 'chat-conversation-item' + (conversation.id === state.activeConversationId ? ' active' : '');
          item.innerHTML = '<div><div class="chat-conversation-title">' + escapeHtml(conversation.title) + '</div><div class="chat-conversation-meta">' + formatDate(conversation.createdAt) + '</div></div>';
          item.addEventListener('click', () => {
            state.activeConversationId = conversation.id;
            saveState();
            renderConversationList();
            renderMessages();
          });
          conversationListEl.appendChild(item);
        });
      }

      window.useSuggestion = function(text) {
        input.value = text;
        sendMessage(text);
      };

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        sendMessage(input.value);
      });

      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 200) + 'px';
      });

      document.getElementById('chatNewConversation').addEventListener('click', () => {
        state.messages = [];
        state.activeConversationId = null;
        saveState();
        renderMessages();
        renderConversationList();
      });

      document.getElementById('clearHistoryBtn').addEventListener('click', () => {
        if (confirm('Clear all chat history?')) {
          state.messages = [];
          state.conversations = [];
          state.activeConversationId = null;
          localStorage.removeItem(STORAGE_KEY);
          renderMessages();
          renderConversationList();
        }
      });

      const chatToggle = document.getElementById('chatToggleSidebar');
      if (chatToggle) {
        chatToggle.addEventListener('click', () => {
          document.getElementById('chatSidebar').classList.toggle('open');
        });
      }

      loadState();
      renderConversationList();
    })();
  </script>
</body>
</html>
